# Builds data.js + towns/*.js + towns.js from every PDF in source/
# Upload a new PDF into source/ and this runs by itself.
name: build voters data

on:
  push:
    paths:
      - "source/**"
      - "build_voters.py"
      - "build_towns.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install poppler (pdftotext)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Build every town in source/
        run: python3 build_towns.py source/ --primary "بر الياس"

      - name: Commit generated data
        run: |
          git config user.name "voters-bot"
          git config user.email "voters-bot@users.noreply.github.com"
          git add data.js towns.js towns/ 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "no changes"
          else
            git commit -m "update voter lists"
            git push
          fi
